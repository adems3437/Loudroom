# Shared by every site (sites/*.conf). Variables make Nginx resolve the containers per request.
set $loudroom_server http://server:4000;
set $loudroom_web http://web:3000;

proxy_http_version 1.1;
proxy_set_header Host $host;
# Overwritten, never appended: a client cannot smuggle its own address in front of the real
# one, which the server trusts with TRUST_PROXY=true. Behind another proxy or CDN, configure
# real_ip first (docs/DEPLOY.md).
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

# Socket.IO (WebSocket only): long-lived upgraded connections.
location /socket.io/ {
  proxy_pass $loudroom_server;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_read_timeout 1h;
  proxy_send_timeout 1h;
}

# Media upload: videos up to 50 MB (MEDIA_MAX_VIDEO_BYTES) plus multipart overhead.
location = /api/admin/media {
  client_max_body_size 55m;
  proxy_read_timeout 120s;
  proxy_pass $loudroom_server;
}

location /api/ {
  proxy_pass $loudroom_server;
}

# Uploaded files: immutable cache headers and byte ranges (video seeking) come from the server.
location /media/ {
  proxy_pass $loudroom_server;
}

location = /health {
  access_log off;
  proxy_pass $loudroom_server;
}

# Pages. The API and media get their security headers from the server (helmet).
location / {
  proxy_pass $loudroom_web;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Strict-Transport-Security $loudroom_hsts always;
}
