# Production reverse proxy (SPEC §13): one origin for the web app, the API, media and the
# Socket.IO connection. Site definitions live in sites/*.conf (HTTP by default; see
# tls.conf.example and docs/DEPLOY.md for HTTPS).
worker_processes auto;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  # No client IPs in the access log (SPEC §9, KVKK): rate limiting gets them through
  # X-Forwarded-For, nothing stores them.
  log_format loudroom escape=json
    '{"time":"$time_iso8601","method":"$request_method","uri":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"seconds":$request_time}';
  access_log /dev/stdout loudroom;
  error_log /dev/stderr warn;

  gzip on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Docker's DNS, re-resolved so restarted containers with new addresses are found.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # HSTS only on HTTPS (sent on pages by locations.conf; empty means no header).
  map $scheme $loudroom_hsts {
    https "max-age=63072000; includeSubDomains";
    default "";
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Request bodies: small everywhere but the media upload (locations.conf).
  client_max_body_size 3m;

  include /etc/nginx/sites/*.conf;
}
