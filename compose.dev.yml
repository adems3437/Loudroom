# Development stack: hot reload for server and web, source bind-mounted from the host.
# Started by a plain `docker compose up` through COMPOSE_FILE in .env.

x-app: &app
  build:
    context: .
    dockerfile: docker/dev.Dockerfile
  image: loudroom-dev:latest
  init: true
  volumes:
    - .:/app
    # Linux dependencies live in volumes so they never mix with the host's macOS node_modules.
    - node-modules:/app/node_modules
    - server-node-modules:/app/apps/server/node_modules
    - web-node-modules:/app/apps/web/node_modules
    - shared-node-modules:/app/packages/shared/node_modules
    - game-sdk-node-modules:/app/packages/game-sdk/node_modules
    - game-quiz-node-modules:/app/packages/games/quiz/node_modules
    - game-closest-number-node-modules:/app/packages/games/closest-number/node_modules
    - game-sorting-node-modules:/app/packages/games/sorting/node_modules
    - game-who-would-node-modules:/app/packages/games/who-would/node_modules
    - game-image-location-node-modules:/app/packages/games/image-location/node_modules
    - game-bluff-node-modules:/app/packages/games/bluff/node_modules
    - game-drawing-node-modules:/app/packages/games/drawing/node_modules
    - game-reaction-node-modules:/app/packages/games/reaction/node_modules
    - game-memory-node-modules:/app/packages/games/memory/node_modules
    - pnpm-store:/pnpm-store
    # Uploaded media (SPEC §13: a Docker volume in the MVP).
    - media-data:/media-data
  environment: &app-env
    NODE_ENV: development
    DATABASE_URL: postgresql://${POSTGRES_USER:-loudroom}:${POSTGRES_PASSWORD:-loudroom}@postgres:5432/${POSTGRES_DB:-loudroom}
    REDIS_URL: redis://redis:6379/0
    PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
    CORS_ORIGINS: ${CORS_ORIGINS:-}
    SERVER_HOST: 0.0.0.0
    SERVER_PORT: '4000'
    WEB_PORT: '3000'
    SOCKET_PORT: ${SOCKET_PORT:-4000}
    PLAYER_RECONNECT_GRACE_MS: ${PLAYER_RECONNECT_GRACE_MS:-90000}
    IP_HASH_SECRET: ${IP_HASH_SECRET:?set IP_HASH_SECRET in .env}
    TRUST_PROXY: ${TRUST_PROXY:-false}
    PROFANITY_EXTRA_WORDS_FILE: ${PROFANITY_EXTRA_WORDS_FILE:-}
    MEDIA_DIR: /media-data
    MEDIA_MAX_UPLOAD_BYTES: ${MEDIA_MAX_UPLOAD_BYTES:-10485760}
    MEDIA_MAX_VIDEO_BYTES: ${MEDIA_MAX_VIDEO_BYTES:-52428800}
    SESSION_RETENTION_DAYS: ${SESSION_RETENTION_DAYS:-180}
    REST_RATE_LIMIT_CAPACITY: ${REST_RATE_LIMIT_CAPACITY:-}
    REST_RATE_LIMIT_PER_SECOND: ${REST_RATE_LIMIT_PER_SECOND:-}
    # The web container reaches the server by its service name.
    API_INTERNAL_URL: http://server:4000

services:
  # One-shot: installs dependencies, builds shared, applies migrations and seeds.
  setup:
    <<: *app
    environment:
      <<: *app-env
      # Development admin (see .env.example); left out when unset.
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-}
    command:
      - sh
      - -ec
      - |
        pnpm install --frozen-lockfile --store-dir /pnpm-store
        pnpm exec turbo run build --filter='./packages/**' --ui=stream
        pnpm --filter @loudroom/server db:generate
        pnpm --filter @loudroom/server db:deploy
        pnpm --filter @loudroom/server db:seed
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: 'no'

  server:
    <<: *app
    # Rebuilds shared on change and restarts Nest on change.
    command: pnpm exec turbo run dev --filter=@loudroom/server... --ui=stream
    ports:
      - '${SERVER_PORT:-4000}:4000'
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:4000/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  web:
    <<: *app
    command: pnpm --filter @loudroom/web dev
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://localhost:3000/admin']
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

volumes:
  media-data:
  node-modules:
  server-node-modules:
  web-node-modules:
  shared-node-modules:
  game-sdk-node-modules:
  game-quiz-node-modules:
  game-closest-number-node-modules:
  game-sorting-node-modules:
  game-who-would-node-modules:
  game-image-location-node-modules:
  game-bluff-node-modules:
  game-drawing-node-modules:
  game-reaction-node-modules:
  game-memory-node-modules:
  pnpm-store:
