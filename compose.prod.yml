# Production stack (SPEC §13), on top of compose.yml. Always run it through scripts/prod.sh,
# which passes .env.prod (never the development .env):
#
#   cp .env.prod.example .env.prod   # then fill in the secrets
#   scripts/prod.sh up -d --build --wait
#
# Services: postgres, redis, migrate (migrations + categories, then exits), server, web,
# nginx (the only published ports) and backup (nightly database + media backups).
# Needs Docker Compose 2.24 or newer (!reset / !override).
name: loudroom-prod

x-server-env: &server-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:-loudroom}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}@postgres:5432/${POSTGRES_DB:-loudroom}
  REDIS_URL: redis://redis:6379/0
  PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env.prod}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  IP_HASH_SECRET: ${IP_HASH_SECRET:?set IP_HASH_SECRET in .env.prod}
  # Nginx overwrites X-Forwarded-For with the client's address (docker/nginx/locations.conf).
  TRUST_PROXY: 'true'
  PLAYER_RECONNECT_GRACE_MS: ${PLAYER_RECONNECT_GRACE_MS:-90000}
  SESSION_RETENTION_DAYS: ${SESSION_RETENTION_DAYS:-180}
  MEDIA_MAX_UPLOAD_BYTES: ${MEDIA_MAX_UPLOAD_BYTES:-10485760}
  MEDIA_MAX_VIDEO_BYTES: ${MEDIA_MAX_VIDEO_BYTES:-52428800}
  PROFANITY_EXTRA_WORDS_FILE: ${PROFANITY_EXTRA_WORDS_FILE:-}

x-server-build: &server-build
  context: .
  dockerfile: docker/server.Dockerfile
  secrets: [extra_ca]

services:
  postgres:
    # Not reachable from outside, and without the development test-database init script.
    ports: !reset []
    volumes: !override
      - postgres-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 256m

  migrate:
    build:
      <<: *server-build
      target: build
    image: loudroom-server-build:latest
    command:
      - sh
      - -ec
      - |
        pnpm --filter @loudroom/server db:deploy
        node apps/server/dist/cli/seed-categories.js
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-loudroom}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-loudroom}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  server:
    build:
      <<: *server-build
      target: runtime
    image: loudroom-server:latest
    init: true
    environment: *server-env
    volumes:
      - media-data:/media-data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Room timers, Redis and pending history writes are closed in order on SIGTERM.
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      secrets: [extra_ca]
    image: loudroom-web:latest
    init: true
    environment:
      # Empty: browsers reach Socket.IO on the page's own origin, through Nginx.
      SOCKET_PORT: ''
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  nginx:
    image: nginx:1.29-alpine
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/locations.conf:/etc/nginx/loudroom/locations.conf:ro
      - ./docker/nginx/sites:/etc/nginx/sites:ro
      # Certificates for sites/tls.conf (docs/DEPLOY.md); unused over plain HTTP.
      - ${TLS_CERTS_DIR:-./docker/nginx/certs}:/etc/nginx/certs:ro
    depends_on:
      web:
        condition: service_healthy
      server:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/health']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    entrypoint: ['/bin/sh', '/opt/loudroom/backup.sh']
    command: ['loop']
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-loudroom}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-loudroom}
      TZ: ${TZ:-Europe/Istanbul}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./docker/backup/backup.sh:/opt/loudroom/backup.sh:ro
      - backups:/backups
      # Read-write: scripts/restore.sh restores media through this container.
      - media-data:/media-data
    depends_on:
      # The server mounts the media volume first, so it is created owned by its user.
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  media-data:
  backups:

secrets:
  # A TLS-intercepting proxy's CA for builds behind it (docs/DEPLOY.md); empty by default.
  extra_ca:
    file: ${EXTRA_CA_CERTS:-/dev/null}
